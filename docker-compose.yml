services:
  postgres:
    image: postgres:16
    container_name: musica-masvida-db
    environment:
      POSTGRES_DB: musica_mas_vida
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
